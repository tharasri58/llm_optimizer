[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-token-optimiser"
version = "0.1.0"
description = "Middleware that reduces token consumption in LLM API calls via prompt compression and rolling conversation-history management."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tharasri" }]
dependencies = [
    "scikit-learn>=1.3",
    "nltk>=3.8",
    "tiktoken>=0.5",
    "click>=8.1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
embeddings = ["sentence-transformers>=2.2"]
local = ["llama-cpp-python>=0.1"]
transformers = ["transformers>=4.0", "torch>=2.0", "torchvision>=0.15", "sentencepiece"]
sdks = ["openai>=1.0", "anthropic>=0.25"]
dev = ["pytest>=7.0", "rouge-score>=0.1.2", "bert-score>=0.3.13"]

[project.scripts]
token-optimiser = "llm_token_optimiser.reporting.cli:main"

[tool.setuptools.packages.find]
include = ["llm_token_optimiser*"]
